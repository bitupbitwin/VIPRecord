name: suborbit
description: "订阅星轨 SubOrbit —— 跨平台会员订阅记账，毛玻璃 UI，时间线分摊统计。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:        # 中文本地化（日期选择器等）
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1      # 响应式状态管理：改数值 -> 统计实时刷新
  hive: ^2.2.3                  # 本地优先存储（纯 Dart，全平台通用）
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  fl_chart: ^0.68.0             # 环形 / 柱状图
  intl: '>=0.19.0 <0.21.0'      # 日期/数字格式化（约束放宽以兼容 flutter_localizations）
  collection: ^1.18.0           # firstWhereOrNull 等安全集合操作
  uuid: ^4.4.0
  supabase_flutter: ^2.5.6      # 云同步（HTTP，全平台含桌面/网页）
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.2  # 到期本地提醒
  timezone: ^0.9.4                      # 定时通知所需时区
  flutter_timezone: ^3.0.1              # 获取设备本地时区

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
